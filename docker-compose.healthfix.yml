services:
  web:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'tripleedms.edwinpxmx.my.id'}); urllib.request.urlopen(r, timeout=5).read()"
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 15s
